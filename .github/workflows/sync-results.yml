name: Auto sync match results

# Scheduling moved to Supabase pg_cron (every minute) — GitHub's scheduled
# workflows drifted badly (gaps of 1.5–3 h observed on 2026-06-11), which
# delayed result syncs past full time. This workflow remains as a manual
# fallback: trigger it from the Actions tab if pg_cron is ever down.
on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: POST sync-results endpoint
        run: |
          curl --fail-with-body --silent --show-error \
               -X POST "${{ secrets.CRON_URL }}/api/cron/sync-results" \
               -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
