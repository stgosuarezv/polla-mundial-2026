name: Round-close digest

# Runs every 30 minutes at HH:05 and HH:35 — offset 5 min past the hour/half-hour
# to sidestep the GitHub-runner congestion spike that hits at :00 / :30.
# The endpoint respects the admin's app_settings.digest_mode toggle, so this
# workflow runs unconditionally; switching to manual mode in the admin UI takes
# effect immediately without editing this file.

on:
  schedule:
    - cron: '5,35 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: POST cron endpoint
        run: |
          curl --fail-with-body \
               --silent \
               --show-error \
               -X POST "${{ secrets.CRON_URL }}/api/cron/snapshot-locked-rounds" \
               -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
