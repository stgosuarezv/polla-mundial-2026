name: Round-close digest

# Scheduling moved to Supabase pg_cron (at :05 and :35) — GitHub's scheduled
# workflows drift by hours. This workflow remains as a manual fallback:
# trigger it from the Actions tab if pg_cron is ever down. The endpoint
# respects the admin's app_settings.digest_mode toggle either way.
on:
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: POST cron endpoint
        run: |
          curl --fail-with-body \
               --silent \
               --show-error \
               -X POST "${{ secrets.CRON_URL }}/api/cron/snapshot-locked-rounds" \
               -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
